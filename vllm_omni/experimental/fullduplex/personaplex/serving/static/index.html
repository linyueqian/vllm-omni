<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PersonaPlex · Full-Duplex Voice</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #131822; --line: #232b3a; --txt: #e6edf3;
    --mut: #8b97a7; --accent: #5b8cff; --good: #2ecc71; --warn: #e0b341; --bad: #ff5d5d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(1200px 600px at 50% -10%, #16203a 0%, var(--bg) 60%);
    color: var(--txt); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .app { width: 100%; max-width: 720px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .2px; }
  .sub { color: var(--mut); font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1 1 auto; }
  label { color: var(--mut); font-size: 12px; display: block; margin-bottom: 6px; }
  input {
    width: 100%; background: #0d1119; border: 1px solid var(--line); color: var(--txt);
    border-radius: 10px; padding: 10px 12px; font: inherit;
  }
  button {
    border: 1px solid var(--line); background: #1b2230; color: var(--txt); font: inherit; font-weight: 600;
    padding: 11px 18px; border-radius: 10px; cursor: pointer; transition: .15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #08101f; }
  button.danger { background: #2a1416; border-color: #50232a; color: var(--bad); }
  .pill { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--mut); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mut); }
  .dot.on { background: var(--good); box-shadow: 0 0 10px var(--good); }
  .dot.busy { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
  .dot.err { background: var(--bad); box-shadow: 0 0 10px var(--bad); }
  .meter { height: 6px; background: #0d1119; border-radius: 4px; overflow: hidden; margin-top: 10px; }
  .meter > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--good), var(--accent)); }
  .transcript {
    margin-top: 16px; background: #0d1119; border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; min-height: 96px; max-height: 240px; overflow: auto; white-space: pre-wrap;
    color: #cdd7e3; font-size: 15px;
  }
  .transcript:empty::before { content: "Agent transcript will appear here…"; color: var(--mut); }
  .hint { color: var(--mut); font-size: 12px; margin-top: 14px; }
  .spacer { height: 16px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>PersonaPlex</h1>
    <span class="sub">full-duplex voice · native engine</span>
  </header>

  <div class="card">
    <div class="row">
      <div class="grow">
        <label for="persona">Persona (optional)</label>
        <input id="persona" type="text" placeholder="e.g. a warm, concise cooking teacher" />
      </div>
      <div style="width:160px">
        <label for="voice">Voice</label>
        <input id="voice" type="text" value="NATF2.pt" />
      </div>
    </div>

    <div class="spacer"></div>

    <div class="row">
      <button id="connect" class="primary">Connect &amp; talk</button>
      <button id="stop" class="danger" disabled>Stop</button>
      <span class="grow"></span>
      <span class="pill"><span id="dot" class="dot"></span><span id="status">idle</span></span>
    </div>

    <div class="meter" title="mic level"><i id="mic"></i></div>
    <div class="transcript" id="transcript"></div>
    <div class="hint">
      Use headphones to avoid the agent hearing itself. Chrome recommended. 24&nbsp;kHz mono PCM over WebSocket.
    </div>
  </div>
</div>

<script>
const SR = 24000;
// Jitter buffer: build this many seconds of lead before playing so network
// variance (high-RTT / remote tunnels) doesn't cause stutter. Raise if choppy.
const TARGET_LEAD = 0.8;
const MIN_LEAD = 0.15;
const $ = (id) => document.getElementById(id);
const ui = {
  connect: $("connect"), stop: $("stop"), status: $("status"), dot: $("dot"),
  mic: $("mic"), transcript: $("transcript"), persona: $("persona"), voice: $("voice"),
};

let ws = null, audioCtx = null, micStream = null, micNode = null, srcNode = null;
let playHead = 0;     // scheduled playback time (s)
let running = false;

function setStatus(text, cls) {
  ui.status.textContent = text;
  ui.dot.className = "dot" + (cls ? " " + cls : "");
}

function wsURL() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  return `${proto}://${location.host}/v1/audio/duplex`;
}

async function start() {
  if (running) return;
  running = true;
  ui.connect.disabled = true; ui.stop.disabled = false;
  ui.transcript.textContent = "";
  setStatus("connecting…", "busy");

  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
  } catch (e) {
    setStatus("mic denied", "err"); stop(); return;
  }

  audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SR });
  await audioCtx.resume();
  playHead = audioCtx.currentTime;

  ws = new WebSocket(wsURL());
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    ws.send(JSON.stringify({
      type: "open",
      persona: ui.persona.value.trim() || null,
      voice: ui.voice.value.trim() || "NATF2.pt",
    }));
    setStatus("listening", "on");
    beginCapture();
  };

  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") {
      const msg = JSON.parse(ev.data);
      if (msg.type === "text" && msg.text) {
        ui.transcript.textContent += msg.text;
        ui.transcript.scrollTop = ui.transcript.scrollHeight;
      } else if (msg.type === "done") {
        setStatus("done", "busy");
      }
      return;
    }
    playPCM(new Float32Array(ev.data));
  };

  ws.onerror = () => setStatus("ws error", "err");
  ws.onclose = () => { if (running) setStatus("closed", "err"); };
}

function beginCapture() {
  srcNode = audioCtx.createMediaStreamSource(micStream);
  // ScriptProcessor is deprecated but dependency-free and fine for a demo.
  micNode = audioCtx.createScriptProcessor(2048, 1, 1);
  srcNode.connect(micNode);
  micNode.connect(audioCtx.destination); // required for the node to run; gain is muted below
  const mute = audioCtx.createGain(); mute.gain.value = 0;
  micNode.disconnect(); micNode.connect(mute); mute.connect(audioCtx.destination);

  micNode.onaudioprocess = (e) => {
    const ch = e.inputBuffer.getChannelData(0);
    // level meter
    let peak = 0; for (let i = 0; i < ch.length; i++) { const a = Math.abs(ch[i]); if (a > peak) peak = a; }
    ui.mic.style.width = Math.min(100, peak * 160) + "%";
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(new Float32Array(ch).buffer); // copy + send raw f32 LE PCM
    }
  };
}

function playPCM(samples) {
  if (!audioCtx || samples.length === 0) return;
  const buf = audioCtx.createBuffer(1, samples.length, SR);
  buf.copyToChannel(samples, 0);
  const node = audioCtx.createBufferSource();
  node.buffer = buf;
  node.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  // Startup or underrun: rebuild a full TARGET_LEAD of buffer ahead of the playhead
  // so subsequent frames play gaplessly even when they arrive late/jittery.
  if (playHead < now + MIN_LEAD) playHead = now + TARGET_LEAD;
  node.start(playHead);
  playHead += buf.duration;
  const lead = playHead - now;
  setStatus(`agent speaking · buffer ${(lead * 1000) | 0}ms`, "busy");
}

function stop() {
  running = false;
  ui.connect.disabled = false; ui.stop.disabled = true;
  ui.mic.style.width = "0%";
  try { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "close" })); } catch (e) {}
  try { if (micNode) micNode.onaudioprocess = null; } catch (e) {}
  try { if (srcNode) srcNode.disconnect(); } catch (e) {}
  try { if (micStream) micStream.getTracks().forEach((t) => t.stop()); } catch (e) {}
  setTimeout(() => { try { if (ws) ws.close(); } catch (e) {} try { if (audioCtx) audioCtx.close(); } catch (e) {} }, 300);
  setStatus("idle", "");
}

ui.connect.onclick = start;
ui.stop.onclick = stop;
</script>
</body>
</html>
